{% extends "base.html" %}{% block title %}Cambiar contraseña · DIF{% endblock %}{% block content %}
<section class="card narrow">
  <p class="eyebrow">Cuenta</p>
  <h1>Cambiar contraseña</h1>
  <p class="muted">Al guardarla se cerrará la sesión en este dispositivo.</p>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/cuenta/contrasena" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Contraseña actual<input type="password" name="current_password" required autocomplete="current-password"></label>
    <label>Nueva contraseña<input type="password" name="new_password" minlength="12" maxlength="200" required autocomplete="new-password"><small>Entre 12 y 200 caracteres.</small></label>
    <label>Confirmar nueva contraseña<input type="password" name="confirm_password" minlength="12" maxlength="200" required autocomplete="new-password"></label>
    <button>Guardar nueva contraseña</button>
    <a class="button ghost" href="/">Cancelar</a>
  </form>
</section>
{% endblock %}
